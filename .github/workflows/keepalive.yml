# Supabase pauses free projects after about a week with no activity.
# This pings the app's keep-alive page twice a day as a backup to the Vercel cron
# (vercel.json). Each run shows under the repo's Actions tab, so it's easy to check.
name: Keep database awake
on:
  schedule:
    - cron: "23 4,16 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive
        run: curl -fsS --retry 3 --retry-delay 20 https://app.verabatch.com/api/keepalive
